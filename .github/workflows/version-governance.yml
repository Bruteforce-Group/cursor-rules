name: Version Governance

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  workflow_dispatch: {}

jobs:
  check-versions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run version consistency check
        run: |
          chmod +x scripts/check_rule_versions.sh
          scripts/check_rule_versions.sh
