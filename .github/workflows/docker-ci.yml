name: Docker CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate rules image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build validation image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          load: true
          push: false
          tags: cursor-rules-validator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run validation in container
        run: >-
          docker run --rm
          --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --cap-drop=ALL
          --security-opt=no-new-privileges
          cursor-rules-validator:${{ github.sha }}
