name: Docker CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build and validate rules image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build validation image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          tags: cursor-rules-validator:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run validation in container
        run: >-
          docker run --rm
          --read-only
          --tmpfs /tmp:rw,noexec,nosuid,size=64m
          --cap-drop=ALL
          --security-opt=no-new-privileges
          cursor-rules-validator:${{ github.sha }}
