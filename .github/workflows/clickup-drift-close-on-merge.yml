name: ClickUp Drift Close on Merge

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read

jobs:
  close-drift-task:
    if: github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'auto-sync')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Close ClickUp drift task
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_DRIFT_LIST_ID: ${{ vars.CLICKUP_DRIFT_LIST_ID }}
          CLICKUP_DRIFT_SPACE_NAME: ${{ vars.CLICKUP_DRIFT_SPACE_NAME }}
          CLICKUP_DRIFT_LIST_NAME: ${{ vars.CLICKUP_DRIFT_LIST_NAME }}
          CLICKUP_DRIFT_FALLBACK_LIST_ID: "901614505478"
          CLICKUP_TASK_ACTION: close
          CLICKUP_DRIFT_TITLE: "[drift] ANVIL-sourced cursor rules out of sync"
          CLICKUP_DRIFT_BODY_FILE: /tmp/clickup-close.md
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGED_BY: ${{ github.event.pull_request.merged_by.login }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cat > /tmp/clickup-close.md <<EOF
          ## Drift resolved

          Auto-sync PR merged.

          **PR:** ${PR_URL}
          **Merged by:** \`${MERGED_BY}\`
          **Run:** ${RUN_URL}
          EOF
          node scripts/clickup-drift-task.js
