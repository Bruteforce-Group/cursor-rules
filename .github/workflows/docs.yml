name: Docs

# Self-managed documentation pipeline (replaces Mintlify):
#   - PRs: validate links + build the static site (no deploy)
#   - main: validate + build + deploy to Cloudflare Workers Static Assets
#
# Deploy requires a CLOUDFLARE_API_TOKEN repo secret with Workers Scripts edit
# permission. The account ID lives in wrangler.jsonc.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_docs.py"
      - "scripts/check_docs_links.py"
      - "requirements-docs.txt"
      - "wrangler.jsonc"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/**"
      - "scripts/build_docs.py"
      - "scripts/check_docs_links.py"
      - "requirements-docs.txt"
      - "wrangler.jsonc"
      - ".github/workflows/docs.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Check documentation links
        run: python3 scripts/check_docs_links.py

      - name: Build static site
        run: python3 scripts/build_docs.py

      - name: Upload site artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-site
          path: site/
          if-no-files-found: error

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install docs dependencies
        run: pip install -r requirements-docs.txt

      - name: Build static site
        run: python3 scripts/build_docs.py

      - name: Deploy to Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret not set; skipping deploy."
            echo "Add the repo secret (Workers Scripts edit) to enable deploys."
            exit 0
          fi
          npx --yes wrangler@latest deploy
