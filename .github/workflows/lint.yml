name: Lint

on:
  pull_request:
    paths:
      - ".github/workflows/lint.yml"
      - "scripts/**"
      - ".cursor/rules/**"
      - ".cursor/commands/**"
      - "cursor-team/**"
      - "docs/**"
      - "VERSION"
      - "README.md"
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Install actionlint
        run: |
          curl -sSf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash | bash
          echo "$PWD" >> "$GITHUB_PATH"

      - name: Validate Cursor Team package
        run: python3 scripts/validate_cursor_team.py

      - name: Run lint.sh
        run: |
          chmod +x scripts/lint.sh
          scripts/lint.sh

      - name: Lint GitHub workflows with actionlint
        run: ./actionlint
