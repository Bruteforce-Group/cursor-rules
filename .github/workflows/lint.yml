name: Lint

on:
  pull_request:
    paths:
      - ".github/workflows/lint.yml"
      - "scripts/**"
      - ".cursor/rules/**"
      - "README.md"
  workflow_dispatch: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Run lint.sh
        run: |
          chmod +x scripts/lint.sh
          scripts/lint.sh
