name: Security Scans

on:
  pull_request:
    paths:
      - "**"
  workflow_dispatch: {}

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run gitleaks
        uses: zricethezav/gitleaks-action@v2.3.2
        with:
          args: "detect --redact --verbose"

  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run OSV-Scanner
        uses: google/osv-scanner@v1
        with:
          scan-args: "./"

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Grype FS scan (replaced Trivy)
        uses: anchore/scan-action@v5  # REPLACED: trivy-action removed due to CVE-2026-33634 supply chain compromise
        with:
          # scan-type removed (Grype auto-detects)
          # vuln-type removed (Grype scans all)
          # scanners removed (Grype handles this)
          severity: "HIGH,CRITICAL"
          # ignore-unfixed removed (use Grype severity-cutoff)
          fail-build: true
          output-format: table
          # output handled by Grype natively
      - name: Upload Grype report
        uses: actions/upload-artifact@v4
        with:
          name: grype-report
          path: grype-report.txt

  trivy-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Grype lockfile scan (replaced Trivy) (deps only)
        uses: anchore/scan-action@v5  # REPLACED: trivy-action removed due to CVE-2026-33634 supply chain compromise
        with:
          # scan-type removed (Grype auto-detects)
          vuln-type: "library"
          scanners: "vuln"
          severity: "HIGH,CRITICAL"
          # ignore-unfixed removed (use Grype severity-cutoff)
          fail-build: true
          output-format: table
          # output handled by Grype natively
          skip-dirs: ".git"
      - name: Upload Trivy lockfile report
        uses: actions/upload-artifact@v4
        with:
          name: grype-lock-report
          path: grype-lock-report.txt

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM with Syft
        uses: anchore/syft-action@v0.1.13
        with:
          output: "sbom.cyclonedx.json"
      - name: Scan SBOM with Grype (replaced Trivy)
        uses: anchore/scan-action@v5  # REPLACED: trivy-action removed due to CVE-2026-33634 supply chain compromise
        with:
          scan-type: "sbom"
          sbom: sbom.cyclonedx.json
          severity: "HIGH,CRITICAL"
          # ignore-unfixed removed (use Grype severity-cutoff)
          fail-build: true
          output-format: table
          # output handled by Grype natively
      - name: Upload SBOM and report
        uses: actions/upload-artifact@v4
        with:
          name: sbom-and-report
          path: |
            sbom.cyclonedx.json
            grype-sbom-report.txt

  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Canary placeholder
        run: |
          echo "Canary check not configured. Set CANARY_CMD or remove this job when wired."
          exit 0
