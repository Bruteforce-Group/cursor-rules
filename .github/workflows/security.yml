name: Security Scans

on:
  pull_request:
    paths:
      - "**"
  push:
    branches: [main]
  schedule:
    - cron: "0 20 * * 0" # weekly (Mon 06:00 AEST) — full-history secret scan
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history on push/schedule (catches secrets committed then removed);
          # shallow on PRs for speed.
          fetch-depth: ${{ github.event_name == 'pull_request' && 1 || 0 }}
      # gitleaks-action requires a paid GITLEAKS_LICENSE for org repos; the
      # MIT-licensed CLI is free, so run the checksum-verified binary directly.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          cd /tmp
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -O
          curl -sSfL "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -O
          grep "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Run gitleaks
        env:
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            /tmp/gitleaks detect --source . --no-git --redact --no-banner
          else
            /tmp/gitleaks detect --source . --redact --no-banner
          fi

  osv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # The repo's only dependency manifest is requirements-docs.txt; parse it
      # as a requirements.txt so OSV-Scanner has a package source to scan.
      - name: Install OSV-Scanner
        env:
          OSV_VERSION: "2.3.8"
        run: |
          cd /tmp
          base="https://github.com/google/osv-scanner/releases/download/v${OSV_VERSION}"
          curl -sSfL "${base}/osv-scanner_linux_amd64" -O
          curl -sSfL "${base}/osv-scanner_SHA256SUMS" -O
          grep -E "[[:space:]][*]?osv-scanner_linux_amd64$" osv-scanner_SHA256SUMS | sha256sum -c -
          mv osv-scanner_linux_amd64 osv-scanner
          chmod +x osv-scanner
      - name: Run OSV-Scanner
        run: /tmp/osv-scanner --lockfile=requirements.txt:requirements-docs.txt

  grype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Grype filesystem scan (HIGH/CRITICAL)
        uses: anchore/scan-action@869c549e657a088dc0441b08ce4fc0ecdac2bb65 # v5
        with:
          path: "."
          severity-cutoff: high
          fail-build: true

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      # sbom-action uploads the generated SBOM as a workflow artifact named below.
      - name: Generate + upload SBOM (Syft)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: "."
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
      - name: Scan SBOM with Grype (HIGH/CRITICAL)
        uses: anchore/scan-action@869c549e657a088dc0441b08ce4fc0ecdac2bb65 # v5
        with:
          sbom: sbom.spdx.json
          severity-cutoff: high
          fail-build: true
