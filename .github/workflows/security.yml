name: Security Scans

on:
  pull_request:
    paths:
      - "**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The gitleaks-action wrapper requires a paid GITLEAKS_LICENSE for org
      # repos; the MIT-licensed gitleaks CLI is free, so run the binary directly.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o /tmp/gitleaks.tgz
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks
      - name: Run gitleaks
        run: /tmp/gitleaks detect --source . --no-git --redact --no-banner

  osv:
    permissions:
      contents: read
      security-events: write
    # The repo's only dependency manifest is requirements-docs.txt; parse it as
    # a requirements.txt so OSV has a package source to scan.
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.3.8
    with:
      scan-args: |-
        --lockfile=requirements.txt:requirements-docs.txt

  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grype filesystem scan (HIGH/CRITICAL)
        uses: anchore/scan-action@v5
        with:
          path: "."
          severity-cutoff: high
          fail-build: true

  trivy-lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Grype dependency scan (HIGH/CRITICAL)
        uses: anchore/scan-action@v5
        with:
          path: "."
          severity-cutoff: high
          fail-build: true

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          path: "."
          format: spdx-json
          output-file: sbom.spdx.json
          artifact-name: sbom.spdx.json
      - name: Scan SBOM with Grype (HIGH/CRITICAL)
        uses: anchore/scan-action@v5
        with:
          sbom: sbom.spdx.json
          severity-cutoff: high
          fail-build: true

  canary:
    runs-on: ubuntu-latest
    steps:
      - name: Canary placeholder
        run: |
          echo "Canary check not configured. Set CANARY_CMD or remove this job when wired."
          exit 0
