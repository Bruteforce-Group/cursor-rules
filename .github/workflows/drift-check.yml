name: Drift Check

# Runs the generator in --check mode daily and manages a ClickUp drift task:
#   - drift detected  -> create/update task
#   - no drift        -> close task
#
# "Drift" means: ClickUp docs or CLAUDE.md have been updated but the generator
# hasn't been run yet, so cursor-rules is serving stale content.

on:
  schedule:
    - cron: '0 21 * * *'   # 07:00 AEST daily (before sync-from-anvil at 08:00)
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generator in check mode
        id: check
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          GITHUB_TOKEN:      ${{ secrets.GH_PAT }}
          ANVIL_HUB_API_KEY: ${{ secrets.ANVIL_HUB_API_KEY }}
        run: |
          if node scripts/generate-anvil-rules.js --check 2>&1 | tee /tmp/drift-output; then
            echo "drifted=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "drifted=true"
              echo "output<<EOF"
              cat /tmp/drift-output
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Upsert ClickUp drift task
        if: steps.check.outputs.drifted == 'true'
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_DRIFT_LIST_ID: ${{ vars.CLICKUP_DRIFT_LIST_ID }}
          CLICKUP_DRIFT_SPACE_NAME: ${{ vars.CLICKUP_DRIFT_SPACE_NAME }}
          CLICKUP_DRIFT_LIST_NAME: ${{ vars.CLICKUP_DRIFT_LIST_NAME }}
          CLICKUP_DRIFT_FALLBACK_LIST_ID: "901614505478"
          CLICKUP_TASK_ACTION: upsert
          CLICKUP_TASK_RESOLVE_DEBUG: ${{ vars.CLICKUP_TASK_RESOLVE_DEBUG }}
          CLICKUP_DRIFT_TITLE: "[drift] ANVIL-sourced cursor rules out of sync"
          CLICKUP_DRIFT_BODY_FILE: /tmp/clickup-drift.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_NAME: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          DRIFT_OUTPUT: ${{ steps.check.outputs.output }}
        run: |
          cat > /tmp/clickup-drift.md <<EOF
          ## ANVIL cursor-rules drift detected

          The generator detected that committed `.mdc` files differ from canonical sources.

          **Run:** ${RUN_URL}
          **Repo:** ${REPO_NAME}
          **Ref:** `${REF_NAME}`

          **Sources checked:**
          - ClickUp `2kz0ewdg-1196` (COVE-ENG-AUTONOMY-001)
          - ClickUp `2kz0ewdg-896` (COVE-PERSONA-001)
          - ClickUp `2kz0ewdg-1176` (COVE-SAFETY-001)
          - `Bruteforce-Group/ANVIL` `.claude/CLAUDE.md`

          **Generator output:**
          ```
          ${DRIFT_OUTPUT}
          ```
          EOF
          node scripts/clickup-drift-task.js

      - name: Close ClickUp drift task
        if: steps.check.outputs.drifted == 'false'
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_DRIFT_LIST_ID: ${{ vars.CLICKUP_DRIFT_LIST_ID }}
          CLICKUP_DRIFT_SPACE_NAME: ${{ vars.CLICKUP_DRIFT_SPACE_NAME }}
          CLICKUP_DRIFT_LIST_NAME: ${{ vars.CLICKUP_DRIFT_LIST_NAME }}
          CLICKUP_DRIFT_FALLBACK_LIST_ID: "901614505478"
          CLICKUP_TASK_ACTION: close
          CLICKUP_TASK_RESOLVE_DEBUG: ${{ vars.CLICKUP_TASK_RESOLVE_DEBUG }}
          CLICKUP_DRIFT_TITLE: "[drift] ANVIL-sourced cursor rules out of sync"
          CLICKUP_DRIFT_BODY_FILE: /tmp/clickup-drift-close.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPO_NAME: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "All ANVIL-sourced cursor rules are in sync with their sources."
          cat > /tmp/clickup-drift-close.md <<EOF
          ## Drift resolved

          Drift check is clean.

          **Run:** ${RUN_URL}
          **Repo:** ${REPO_NAME}
          **Ref:** \`${REF_NAME}\`
          EOF
          node scripts/clickup-drift-task.js
