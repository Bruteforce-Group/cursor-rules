name: Drift Check

# Runs the generator in --check mode daily and opens a GitHub issue if the
# committed .mdc files have drifted from their canonical sources.
#
# "Drift" means: ClickUp docs or CLAUDE.md have been updated but the generator
# hasn't been run yet, so cursor-rules is serving stale content.

on:
  schedule:
    - cron: '0 21 * * *'   # 07:00 AEST daily (before sync-from-anvil at 08:00)
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  drift-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generator in check mode
        id: check
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          GITHUB_TOKEN:      ${{ secrets.GH_PAT }}
          ANVIL_HUB_API_KEY: ${{ secrets.ANVIL_HUB_API_KEY }}
        run: |
          if node scripts/generate-anvil-rules.js --check 2>&1 | tee /tmp/drift-output; then
            echo "drifted=false" >> $GITHUB_OUTPUT
          else
            echo "drifted=true"  >> $GITHUB_OUTPUT
            echo "output<<EOF"   >> $GITHUB_OUTPUT
            cat /tmp/drift-output >> $GITHUB_OUTPUT
            echo "EOF"           >> $GITHUB_OUTPUT
          fi

      - name: Open drift issue
        if: steps.check.outputs.drifted == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const today = new Date().toISOString().slice(0,10);
            const title = `[drift] ANVIL-sourced rules out of sync — ${today}`;

            // Check for an existing open drift issue to avoid duplicates
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              state: 'open',
              labels: 'drift',
            });
            if (existing.data.some(i => i.title.startsWith('[drift]'))) {
              console.log('Open drift issue already exists — skipping creation.');
              return;
            }

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              title,
              body: [
                '## ANVIL cursor-rules drift detected',
                '',
                'The generator detected that committed `.mdc` files differ from their canonical sources.',
                '',
                '**Sources checked:**',
                '- ClickUp `2kz0ewdg-1196` (COVE-ENG-AUTONOMY-001)',
                '- ClickUp `2kz0ewdg-896` (COVE-PERSONA-001)',
                '- ClickUp `2kz0ewdg-1176` (COVE-SAFETY-001)',
                '- `Bruteforce-Group/ANVIL` `.claude/CLAUDE.md`',
                '',
                '**Generator output:**',
                '```',
                `${{ steps.check.outputs.output }}`,
                '```',
                '',
                '**To fix:** trigger the [Sync ANVIL Rules](../actions/workflows/sync-from-anvil.yml) workflow, or run locally:',
                '```bash',
                'CLICKUP_API_TOKEN=xxx node scripts/generate-anvil-rules.js',
                'bash scripts/bump_rule_versions.sh',
                'git add .cursor/rules/ VERSION .governance/versions.json',
                'git commit -m "chore(rules): sync ANVIL-sourced rules"',
                '```',
              ].join('\n'),
              labels: ['drift', 'auto'],
            });
            console.log(`Opened drift issue: ${title}`);

      - name: All rules in sync
        if: steps.check.outputs.drifted == 'false'
        run: echo "All ANVIL-sourced cursor rules are in sync with their sources."
