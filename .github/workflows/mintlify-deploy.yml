name: Mintlify Deploy

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "docs.json"
      - "**/*.mdx"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: mintlify-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      MINTLIFY_PROJECT_ID: 69504b7eca5e444cf04bd8a9
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check docs for broken internal links
        run: |
          if [ ! -f docs.json ]; then
            echo "docs.json not present; skipping mintlify broken-links";
            exit 0
          fi
          MINTLIFY_CI=1 npx mintlify@latest broken-links
