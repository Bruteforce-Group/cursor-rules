name: Sync ANVIL Rules

# Regenerates ANVIL-sourced .mdc files from ClickUp + GitHub sources and
# opens a PR (or auto-commits to main if called from the ANVIL trigger).
#
# Triggers:
#   - workflow_dispatch (manual or from ANVIL repo trigger)
#   - schedule: daily at 22:00 UTC (08:00 AEST) as a safety net

on:
  workflow_dispatch:
    inputs:
      auto_merge:
        description: 'Auto-merge PR if only generated files changed'
        required: false
        default: 'false'
        type: boolean
  schedule:
    - cron: '0 22 * * *'   # 08:00 AEST daily

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run generator
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          GITHUB_TOKEN:      ${{ secrets.GH_PAT }}
          ANVIL_HUB_API_KEY: ${{ secrets.ANVIL_HUB_API_KEY }}
        run: node scripts/generate-anvil-rules.js

      - name: Check for changes
        id: diff
        run: |
          git diff --name-only | tee /tmp/changed_files
          if [ -s /tmp/changed_files ]; then
            {
              echo "changed=true"
              echo "files=$(tr '\n' ' ' < /tmp/changed_files)"
            } >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run lint + version check
        if: steps.diff.outputs.changed == 'true'
        run: |
          chmod +x scripts/lint.sh scripts/check_rule_versions.sh
          scripts/lint.sh
          scripts/check_rule_versions.sh

      - name: Commit and open PR
        id: sync_pr
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          git config user.name  "cursor-rules-bot"
          git config user.email "bot@boz.dev"

          BRANCH="auto/anvil-sync-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git add .cursor/rules/
          git commit -m "chore(rules): sync ANVIL-sourced rules from ClickUp + CLAUDE.md

          Auto-generated by sync-from-anvil workflow.
          Changed: ${{ steps.diff.outputs.files }}
          Source: ClickUp COVE-ENG-AUTONOMY-001 + COVE-PERSONA-001 + COVE-SAFETY-001 + Bruteforce-Group/ANVIL .claude/CLAUDE.md"

          git push origin "$BRANCH"

          PR_URL="$(gh pr create \
            --title "chore(rules): sync ANVIL-sourced rules $(date +%Y-%m-%d)" \
            --body "Auto-generated by \`sync-from-anvil\` workflow.

          **Changed files:** \`${{ steps.diff.outputs.files }}\`

          **Sources:**
          - ClickUp \`2kz0ewdg-1196\` (COVE-ENG-AUTONOMY-001)
          - ClickUp \`2kz0ewdg-896\` (COVE-PERSONA-001)
          - ClickUp \`2kz0ewdg-1176\` (COVE-SAFETY-001)
          - \`Bruteforce-Group/ANVIL\` \`.claude/CLAUDE.md\`

          Review the diff and merge — version governance CI will validate." \
            --base main \
            --head "$BRANCH" \
            --label "auto-sync")"
          echo "pr_url=$PR_URL" >> "$GITHUB_OUTPUT"

      - name: Upsert ClickUp drift task
        if: steps.diff.outputs.changed == 'true'
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_DRIFT_LIST_ID: ${{ vars.CLICKUP_DRIFT_LIST_ID }}
          CLICKUP_DRIFT_SPACE_NAME: ${{ vars.CLICKUP_DRIFT_SPACE_NAME }}
          CLICKUP_DRIFT_LIST_NAME: ${{ vars.CLICKUP_DRIFT_LIST_NAME }}
          CLICKUP_DRIFT_FALLBACK_LIST_ID: "901614505478"
          CLICKUP_TASK_ACTION: upsert
          CLICKUP_DRIFT_TITLE: "[drift] ANVIL-sourced cursor rules out of sync"
          CLICKUP_DRIFT_BODY_FILE: /tmp/clickup-sync.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PR_URL: ${{ steps.sync_pr.outputs.pr_url }}
          CHANGED_FILES: ${{ steps.diff.outputs.files }}
        run: |
          cat > /tmp/clickup-sync.md <<EOF
          ## ANVIL cursor-rules drift active

          Sync workflow generated updates and opened/updated a PR.

          **Run:** ${RUN_URL}
          **PR:** ${PR_URL}
          **Changed files:** \`${CHANGED_FILES}\`

          Keep this task open until the sync PR merges.
          EOF
          node scripts/clickup-drift-task.js

      - name: No changes
        if: steps.diff.outputs.changed == 'false'
        env:
          CLICKUP_API_TOKEN: ${{ secrets.CLICKUP_API_TOKEN }}
          CLICKUP_DRIFT_LIST_ID: ${{ vars.CLICKUP_DRIFT_LIST_ID }}
          CLICKUP_DRIFT_SPACE_NAME: ${{ vars.CLICKUP_DRIFT_SPACE_NAME }}
          CLICKUP_DRIFT_LIST_NAME: ${{ vars.CLICKUP_DRIFT_LIST_NAME }}
          CLICKUP_DRIFT_FALLBACK_LIST_ID: "901614505478"
          CLICKUP_TASK_ACTION: close
          CLICKUP_DRIFT_TITLE: "[drift] ANVIL-sourced cursor rules out of sync"
          CLICKUP_DRIFT_BODY_FILE: /tmp/clickup-sync-close.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          echo "All generated rules already up to date — no PR needed."
          cat > /tmp/clickup-sync-close.md <<EOF
          ## Drift resolved

          Sync workflow found no generated changes; rules are currently in sync.

          **Run:** ${RUN_URL}
          EOF
          node scripts/clickup-drift-task.js
